services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: neoplays/simple-vod:latest
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - db:/data/db
      - videos:/data/videos
      - bin:/data/bin
    env_file:
      - .env
    restart: unless-stopped

volumes:
  db:
  videos:
  bin:
