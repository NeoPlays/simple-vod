<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyVOD</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/shared.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  <style>
    body { background: #000; display: flex; flex-direction: column; min-height: 100vh; }

    .player-wrap {
      position: relative;
      width: 100%; aspect-ratio: 16/9;
      background: #000;
      user-select: none;
    }
    .player-wrap.idle { cursor: none; }

    video { display: block; width: 100%; height: 100%; object-fit: contain; }

    /* Control layers */
    .ctrl-top, .ctrl-bottom, .ctrl-center {
      position: absolute; left: 0; right: 0;
      opacity: 0; pointer-events: none;
      transition: opacity 200ms ease;
    }
    .ctrl-top.show, .ctrl-bottom.show {
      opacity: 1; pointer-events: auto;
    }
    .ctrl-center.show {
      opacity: 1;
      /* keep pointer-events: none on the container — only the button inside is clickable */
    }
    .ctrl-center.show .center-play-btn {
      pointer-events: auto;
    }

    /* Top bar */
    .ctrl-top {
      top: 0; padding: 16px 20px;
      display: flex; align-items: center; justify-content: space-between;
      background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 100%);
    }
    .ctrl-top-left { display: flex; align-items: center; gap: 12px; }
    .back-btn {
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(20px);
      border: 0.5px solid rgba(255,255,255,0.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; text-decoration: none; flex-shrink: 0;
    }
    .video-title { font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.85); }
    .video-meta  { font-size: 11px; color: rgba(255,255,255,0.5); letter-spacing: 0.04em; }

    /* Center play button */
    .ctrl-center {
      top: 0; bottom: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .center-play-btn {
      width: 64px; height: 64px; border-radius: 50%;
      background: rgba(0,0,0,0.4); backdrop-filter: blur(20px);
      border: 0.5px solid rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }

    /* Bottom bar */
    .ctrl-bottom {
      bottom: 0; padding: 24px 20px 16px;
      background: linear-gradient(0deg, rgba(0,0,0,0.7) 0%, transparent 100%);
    }
    .scrub-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .time { font-size: 11px; color: rgba(255,255,255,0.7); font-variant-numeric: tabular-nums; min-width: 36px; }
    .time.end { color: rgba(255,255,255,0.5); text-align: right; }
    .scrub-track {
      flex: 1; height: 3px; background: rgba(255,255,255,0.15);
      border-radius: 2px; position: relative; cursor: pointer;
      padding: 8px 0; margin: -8px 0;
    }
    .scrub-fill {
      position: absolute; left: 0; top: 8px;
      height: 3px; background: var(--fg-primary);
      border-radius: 2px; pointer-events: none;
    }
    .scrub-handle {
      position: absolute; top: 50%; transform: translate(-50%, -50%);
      width: 11px; height: 11px; background: var(--fg-primary);
      border-radius: 50%; pointer-events: none;
      margin-top: 8px;
    }
    .transport-row { display: flex; align-items: center; justify-content: space-between; }
    .transport-left, .transport-right { display: flex; align-items: center; gap: 18px; }
    .ctrl-btn { background: none; border: none; cursor: pointer; padding: 0; color: rgba(255,255,255,0.85); display: flex; }
    .ctrl-btn:hover { color: #fff; }
  </style>
</head>
<body x-data="playerPage()" @keydown.window="handleKey($event)">
  <div class="player-wrap" :class="{ idle: !showControls && playing }"
    x-ref="player"
    @mousemove="onMouseMove"
    @mouseleave="showControls = false">

    <video x-ref="video"
      :src="src"
      @timeupdate="onTimeUpdate"
      @loadedmetadata="onMeta"
      @play="playing = true"
      @pause="playing = false"
      @ended="playing = false"
      @click="togglePlay">
    </video>

    <!-- Top bar -->
    <div class="ctrl-top" :class="{ show: showControls }">
      <div class="ctrl-top-left">
        <a class="back-btn" href="/videos.html">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none">
            <path d="M15 6L9 12L15 18" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </a>
        <span class="video-title" x-text="name"></span>
      </div>
      <span class="video-meta" x-show="duration > 0" x-text="formatTime(duration)"></span>
    </div>

    <!-- Center play button (only when paused) -->
    <div class="ctrl-center" :class="{ show: !playing && showControls }">
      <div class="center-play-btn" @click="togglePlay">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M7 5L19 12L7 19V5Z" fill="#fff"/>
        </svg>
      </div>
    </div>

    <!-- Bottom bar -->
    <div class="ctrl-bottom" :class="{ show: showControls }">
      <div class="scrub-row">
        <span class="time" x-text="formatTime(currentTime)"></span>
        <div class="scrub-track" x-ref="scrub" @click="seekClick($event)">
          <div class="scrub-fill" :style="{ width: progress + '%' }"></div>
          <div class="scrub-handle" :style="{ left: progress + '%' }"></div>
        </div>
        <span class="time end" x-text="formatTime(duration)"></span>
      </div>
      <div class="transport-row">
        <div class="transport-left">
          <!-- Skip back 10s -->
          <button class="ctrl-btn" @click="skip(-10)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path d="M11 6L4 12L11 18M20 6L13 12L20 18"
                stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <!-- Play/pause -->
          <button class="ctrl-btn" @click="togglePlay">
            <template x-if="playing">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <rect x="6" y="5" width="4" height="14" fill="currentColor"/>
                <rect x="14" y="5" width="4" height="14" fill="currentColor"/>
              </svg>
            </template>
            <template x-if="!playing">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <path d="M7 5L19 12L7 19V5Z" fill="currentColor"/>
              </svg>
            </template>
          </button>
          <!-- Skip forward 10s -->
          <button class="ctrl-btn" @click="skip(10)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path d="M13 6L20 12L13 18M4 6L11 12L4 18"
                stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        <div class="transport-right">
          <!-- Volume -->
          <button class="ctrl-btn" @click="toggleMute">
            <template x-if="!muted">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                <path d="M11 5L7 9H4V15H7L11 19V5Z" fill="currentColor"/>
                <path d="M16 9C17 10 17 14 16 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M19 6C21.5 8 21.5 16 19 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </template>
            <template x-if="muted">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                <path d="M11 5L7 9H4V15H7L11 19V5Z" fill="currentColor"/>
                <path d="M15 9L21 15M21 9L15 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </template>
          </button>
          <!-- Fullscreen -->
          <button class="ctrl-btn" @click="toggleFullscreen">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
              <path d="M4 8V4H8M16 4H20V8M20 16V20H16M8 20H4V16"
                stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    function playerPage() {
      return {
        src: '', name: '', id: null,
        playing: false, currentTime: 0, duration: 0, progress: 0,
        muted: false, showControls: true,
        _idleTimer: null,

        async init() {
          const res = await fetch('/user');
          if (!res.ok) { window.location.replace('/login.html'); return; }

          const p = new URLSearchParams(window.location.search);
          this.id = p.get('id');
          this.name = p.get('name') || `Video #${this.id}`;
          if (!this.id) { window.location.replace('/videos.html'); return; }

          this.src = `/videos/${this.id}`;
          document.title = `${this.name} — MyVOD`;
          this.onMouseMove();
        },

        onMeta() {
          this.duration = this.$refs.video.duration;
        },

        onTimeUpdate() {
          this.currentTime = this.$refs.video.currentTime;
          this.progress = this.duration ? (this.currentTime / this.duration) * 100 : 0;
        },

        togglePlay() {
          const v = this.$refs.video;
          v.paused ? v.play() : v.pause();
        },

        skip(secs) {
          this.$refs.video.currentTime = Math.max(0, Math.min(this.duration, this.currentTime + secs));
        },

        seekClick(e) {
          const rect = this.$refs.scrub.getBoundingClientRect();
          const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
          this.$refs.video.currentTime = pct * this.duration;
        },

        toggleMute() {
          this.muted = !this.muted;
          this.$refs.video.muted = this.muted;
        },

        toggleFullscreen() {
          if (!document.fullscreenElement) {
            this.$refs.player.requestFullscreen();
          } else {
            document.exitFullscreen();
          }
        },

        onMouseMove() {
          this.showControls = true;
          clearTimeout(this._idleTimer);
          this._idleTimer = setTimeout(() => {
            if (this.playing) this.showControls = false;
          }, 2000);
        },

        handleKey(e) {
          if (e.target.tagName === 'INPUT') return;
          if (e.key === ' ')           { e.preventDefault(); this.togglePlay(); }
          else if (e.key === 'ArrowLeft')  this.skip(-10);
          else if (e.key === 'ArrowRight') this.skip(10);
          else if (e.key === 'f')          this.toggleFullscreen();
          else if (e.key === 'm')          this.toggleMute();
        },

        formatTime(secs) {
          if (!secs || isNaN(secs)) return '0:00';
          const h = Math.floor(secs / 3600);
          const m = Math.floor((secs % 3600) / 60);
          const s = Math.floor(secs % 60);
          if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
          return `${m}:${String(s).padStart(2,'0')}`;
        },
      };
    }
  </script>
</body>
</html>
